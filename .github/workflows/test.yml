name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    name: pytest (_outreach_core)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 first: it is the PRODUCTION interpreter (jp-form-outreach/.venv
        # and the watchdog LaunchAgent both run 3.9 on the Mac mini). The
        # watchdog once died silently for a month on a syntax error that only
        # a 3.9 import would surface — CI must test what production runs.
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The test suite is intentionally light on deps: pytest + pyyaml is
          # all the _outreach_core/ tests need. Browser-driving deps
          # (playwright, openclaw) are NOT installed here — those tests
          # always stub out the browser surface, so CI stays fast.
          python -m pip install pytest pyyaml
      - name: Run pytest
        run: |
          python -m pytest _outreach_core/tests -q
