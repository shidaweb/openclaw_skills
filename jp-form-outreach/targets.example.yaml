# Curated company list. Pre-loaded with the May 2026 batch
# (Torana → JP mid-market for LINE×CRM consult).
#
# Status legend:
#   sent       — already submitted via this pipeline
#   pending    — ready to draft & send
#   blocked    — needs Nori's input (e.g. company profile data)
#   manual     — needs human intervention (iframe, kintone, B2C-only)
#   linkedin   — route via linkedin-outreach instead
#   dropped    — out of scope (site closed, etc.)
#
# Category controls how stage_send treats the target:
#   b2b_form        — standard B2B inquiry form (auto-send)
#   b2c_only        — only B2C support form available (skip)
#   iframe          — third-party iframe form (manual for now)
#   site_closed     — company merged/closed (drop)
#
# field_map_overrides: per-form non-standard fields. Example:
#   field_map_overrides:
#     category_radio: "その他"          # what to select for the お問い合わせ種別 radio
#     category_select: "業務提携について"  # what to select for the 概要 dropdown
#     prefecture_select_format: "千葉県"
#     phone_format: "hyphenated"        # use sender.phone_hyphenated (else use sender.phone)
#     postal_format: "no_hyphen"        # use sender.postal_code_no_hyphen
#     skip_fields: ["fax"]              # don't try to fill these
#
# flow:
#   single   — fill → send (1 click)
#   confirm  — fill → 確認 → 送信 (2 clicks, 2 page transitions)

