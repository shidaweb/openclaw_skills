# jp-form-outreach: config
#
# Copy this file to config.yaml and fill in your own pitch/sender info.
# Optional: copy ../sender_brief.example.yaml to ../sender_brief.yaml (merged; overrides apply).
#
# Model policy (v4): Slack/OpenClaw agent = Opus 4.7. draft/refine = model.name (Opus).
# _llm_analyze_form = form_analyzer_name (Sonnet, cost-optimal for DOM→JSON).
# The contents become a cached system prompt — keeping this file stable
# across runs gives ~95% prompt cache hits and minimal Claude credit usage.

sender:
  name: "山田 太郎"
  name_kana: "ヤマダタロウ"
  name_furigana: "やまだたろう"
  # Optional explicit 姓/名 splits. If omitted, the furigana guardrail splits
  # name_kana / name_furigana with a 2-char heuristic (sei = first 2, mei = rest).
  # Set these when the heuristic is wrong (e.g. a 1-char or 3-char surname).
  # name_kana_sei: "ヤマダ"
  # name_kana_mei: "タロウ"
  # name_furigana_sei: "やまだ"
  # name_furigana_mei: "たろう"
  role: "代表"             # 役職名 used in form 役職 fields
  company: "サンプル株式会社"
  company_short: "サンプル"
  email: "you@example.com"
  phone: "0312345678"       # No hyphens (most JP forms accept either)
  phone_hyphenated: "03-1234-5678"
  postal_code: "100-0001"   # ハイフンあり
  postal_code_no_hyphen: "1000001"
  prefecture: "東京都"
  city: "千代田区"
  address_line: "1-1-1"
  building: "サンプルビル1階"
  full_address: "東京都千代田区1-1-1 サンプルビル1階"
  calendar_url: "https://example.com/your-booking-url"
  founded_year_month: "2020年04月"   # for forms requiring 設立年月
  annual_revenue_band: "1〜3億円"   # for 年商 fields
  employee_count_band: "1〜9名"     # for 従業員数 fields

# What you're selling / why you're reaching out.
pitch:
  one_liner: "（あなたの商材を1文で。例：◯◯運用×CRMコンサルを提供しております）"
  problem: |
    （見込み客が抱えがちな課題を2〜3行で。固有名詞は入れない。）
  solution: |
    （あなたの解決策を2〜3行で。どの業界のどんな論点に効くかを簡潔に。）
  proof_points:
    - "（実績・事例1：自社の実クライアント／領域に置き換える）"
    - "（実績・事例2）"
    - "（実績・事例3）"
  call_to_action: "30分のオンラインでご相談いただけませんでしょうか。\nご都合よろしければ：https://example.com/your-booking-url"

# 想定ターゲットペルソナ。LLMがどう該当するかを判断する材料。
target_persona:
  industries:
    - "EdTech / 通信教育 / 学習塾"
    - "D2C / サブスク / 通販"
    - "ヘルスケア / オンライン診療"
    - "ペット / フィットネス / 葬儀"
    - "結婚相談 / ブライダル / 家事代行"
  founding_year_sweet_spot: "1995-2012"
  reason: |
    LINEがマーケ主流チャネルになる前から事業を運営してきた老舗ミドル中堅は、
    LINEを後付けで導入したものの未最適化な状態にある典型例が多い。若い
    スタートアップは最初からLINE×CRMネイティブで設計されている確率が高い
    ため除外。
  decision_makers:
    - "事業企画 / マーケティング / CRMご担当者"
    - "経営企画 / 事業開発"
    - "DX推進"

# Claude model & generation settings
model:
  name: "claude-cli/claude-opus-4-7"           # draft / refine / char_limit compress
  form_analyzer_name: "claude-cli/claude-sonnet-4-6"  # _llm_analyze_form only
  max_chars: 400        # 多くのJP法人フォームの制限が400字
  max_chars_extended: 1800  # ファビウス／カラダノート等は2000字許容
  language: "ja"

# Draft pipeline (v4)
draft:
  refine_default: true   # run.py draft / campaign use 2-pass unless --no-refine

# Personalization rules
personalization:
  must_reference: |
    必ず1つ以上、相手企業の固有な事実（直近のPRリリース／資金調達／
    新サービス発表／メディア露出／IR資料の戦略テーマ等）に言及する。
  avoid:
    - "テンプレ感のある定型句（『突然のご連絡失礼いたします』を冒頭にしない）"
    - "誇大広告（業界NO.1、必ず成功するなど）"
    - "長すぎる自己紹介（自己紹介は2文以内）"
    - "本部以外のFC教室へのプッシュ（FC型ビジネスは本部CRMで考える）"
  tone: "敬語、ただし堅すぎない。同業界の人として自然に話す距離感。"

# Filtering rules (applied before LLM, deterministic)
filters:
  exclude_already_sent: true     # data/sent_history.jsonl で除外
  exclude_skip_history: true     # data/skip_history.jsonl で除外
  exclude_categories:
    - "b2c_only"     # B2C顧客フォームしかない会社（LinkedIn DMルートに回す）
    - "iframe"       # 第三者ホスト iframe フォーム（v2で対応）
    - "site_closed"  # 合併・サイト閉鎖

# Slack one-way status posts (see sender_brief.yaml)
# slack:
#   incoming_webhook_url: "https://hooks.slack.com/services/..."
