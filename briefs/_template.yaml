# Copy to briefs/<your-brief-id>.yaml and fill in.

brief:
  id: "your-brief-id"
  display_name: "Display Name"
  active_since: "2026-05-26"
  notes: ""

# Who is speaking. Sender identity and voice live in personas/<id>.yaml.
persona_id: "your-persona-id"

product:
  name: ""
  one_liner: ""

pitch:
  problem: |
  solution: |
  proof_points: []
  call_to_action: ""

target:
  industries: []
  decision_makers: []
  geo: "JP"

desired_channels:
  - "jp_form"
  - "linkedin"

personalization:
  must_reference: ""
  avoid: []
  tone: "敬語"

prompts_overrides:
  jp_form_system_persona: null
  jp_form_examples: null
  linkedin_system_persona: null

slack:
  incoming_webhook_url: ""
  channel_id: ""

heartbeat:
  interval_sec: 600
  enabled_for:
    - "all"

browser:
  headless: true
  cookie_consent: "accept"   # accept | skip (reject: future)

# 自律運用 (v5 §12)。省略時は sender_brief.yaml の既定（mode: supervised）を継承。
# この brief を完全自律にする場合のみ上書きする:
# autonomy:
#   mode: "autonomous"
#   draft_self_score:
#     threshold: 0.75
#   upfront_approval:
#     required: true
#     sample_drafts: 3

model:
  name: "claude-cli/claude-opus-4-7"
  form_analyzer_name: "claude-cli/claude-sonnet-4-6"
  max_chars: 400
  max_chars_extended: 1800
  language: "ja"

draft:
  refine_default: true
